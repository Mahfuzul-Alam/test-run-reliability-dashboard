services:
  - type: web
    name: test-run-reliability-dashboard
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://mahfuzshanto.github.io"
